<body class="bg-background text-on-surface min-h-screen flex flex-col items-center justify-center relative selection:bg-on-surface selection:text-surface">
<!-- Ambient Texture Layer -->
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_center,rgba(255,255,255,0.02)_0%,transparent_70%)] pointer-events-none"></div>
<!-- Main Content Area -->
<main class="z-10 w-full max-w-md px-gutter md:px-0 flex flex-col pt-12 md:pt-0">
<!-- Header Section -->
<div class="mb-10 text-center md:text-left">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tighter uppercase mb-2">
                REHLA
            </h1>
<h2 class="font-headline-md text-headline-md text-on-surface mb-3">
                Management Engine
            </h2>
<div class="flex items-center justify-center md:justify-start gap-3">
<div class="w-8 h-[2px] bg-primary hidden md:block"></div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Secure access for authorized staff only.
                </p>
</div>
</div>
<!-- Login Card (Brutalist style with border layering) -->
<div class="bg-surface-container-low border border-outline-variant p-8 md:p-10 relative">
<!-- Hard Shadow Offset -->
<div class="absolute top-2 left-2 w-full h-full border border-outline-variant -z-10 bg-background hidden md:block"></div>
<form action="#" class="space-y-6" method="POST">
<!-- Input Group: Staff ID -->
<div>
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase mb-2" for="staff-id">
                        Staff ID / Email
                    </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-on-surface transition-colors">
                            badge
                        </span>
<input class="w-full bg-surface border border-outline-variant text-on-surface pl-10 pr-4 py-3 focus:outline-none focus:border-on-surface focus:ring-1 focus:ring-on-surface transition-all font-data-mono text-data-mono placeholder:text-outline-variant" id="staff-id" name="staff-id" placeholder="ENG-0000" required="" type="text"/>
</div>
</div>
<!-- Input Group: Password -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="block font-label-sm text-label-sm text-on-surface-variant uppercase" for="password">
                            Password
                        </label>
<a class="font-label-sm text-label-sm text-outline hover:text-on-surface transition-colors border-b border-transparent hover:border-on-surface" href="#">
                            Forgot Password?
                        </a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant group-focus-within:text-on-surface transition-colors">
                            lock
                        </span>
<input class="w-full bg-surface border border-outline-variant text-on-surface pl-10 pr-4 py-3 focus:outline-none focus:border-on-surface focus:ring-1 focus:ring-on-surface transition-all font-data-mono text-data-mono placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="w-full bg-on-surface text-surface py-4 flex items-center justify-center gap-3 border border-transparent hover:bg-surface hover:text-on-surface hover:border-on-surface transition-colors duration-200 group" type="submit">
<span class="font-headline-md text-headline-md uppercase tracking-wide">Enter Engine</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">
                            arrow_forward
                        </span>
</button>
</div>
<div id="login-error" class="hidden font-label-sm text-error text-center uppercase tracking-wide mt-3"></div>
<!-- Secondary Action -->
<div class="text-center pt-2">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-on-surface transition-colors uppercase border-b border-outline-variant pb-1 hover:border-on-surface" href="#">
                        Request Access
                    </a>
</div>

<!-- Footer Information -->
<footer class="absolute bottom-8 w-full flex flex-col items-center justify-center gap-2 pointer-events-none px-gutter text-center">
<div class="font-data-mono text-data-mono text-outline flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse inline-block"></span>
            SYS_STATUS: SECURE // v3.1.4
        </div>
<div class="font-label-sm text-label-sm text-on-surface-variant opacity-60 uppercase tracking-widest">
            Powered by Rehla
        </div>
</footer>
<script src="../auth-client.js"></script>
<script>
    const form = document.querySelector('form');
    const errorEl = document.getElementById('login-error');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('hidden');
        
        const username = document.getElementById('staff-id').value.trim();
        const password = document.getElementById('password').value;

        try {
            const data = await Auth.apiRequest('/api/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            });

            Auth.setSession(data.token, data.user);
            Auth.redirectToRoleDefault(data.user.role);
        } catch (err) {
            errorEl.textContent = err.message || 'Login failed';
            errorEl.classList.remove('hidden');
        }
    });
</script>
