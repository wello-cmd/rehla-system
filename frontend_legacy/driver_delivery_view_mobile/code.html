<script src="../auth-client.js"></script>
<script>
    // Validate role
    Auth.checkAuth(['driver']);

    const user = Auth.getUser();
    document.getElementById('driver-profile-name').textContent = user ? user.name : 'Driver';
    
    // Set date
    const todayDate = new Date();
    document.getElementById('today-date-text').textContent = `Today, ${todayDate.toLocaleDateString('en-US', { day: 'numeric', month: 'short' })}`;

    let deliveries = [];

    async function loadDriverDeliveries() {
        try {
            deliveries = await Auth.apiRequest('/api/deliveries');
            renderDriverStats();
            renderDeliveriesList();
        } catch (err) {
            console.error(err);
        }
    }

    function renderDriverStats() {
        const assigned = deliveries.filter(d => ['assigned', 'journey_started', 'out_for_delivery'].includes(d.status)).length;
        const completed = deliveries.filter(d => d.status === 'delivered').length;
        const failed = deliveries.filter(d => d.status === 'failed').length;

        document.getElementById('stat-driver-assigned').textContent = assigned;
        document.getElementById('stat-driver-completed').textContent = completed;
        document.getElementById('stat-driver-failed').textContent = failed;
    }

    function renderDeliveriesList() {
        const container = document.getElementById('driver-deliveries-list');
        container.innerHTML = '';

        const active = deliveries.filter(d => !['delivered', 'failed'].includes(d.status));
        if (active.length === 0) {
            container.innerHTML = `
                <div class="border border-dashed border-outline-variant bg-surface-container p-8 text-center text-on-surface-variant font-label-sm uppercase tracking-wider">
                    No active deliveries assigned to you.
                </div>
            `;
            return;
        }

        active.forEach(d => {
            const card = document.createElement('article');
            card.className = `bg-surface-container border border-outline-variant rounded-lg p-4 flex flex-col gap-4 relative shadow-[4px_4px_0px_#ffffff]`;
            
            const isCOD = d.payment_method === 'cash';
            const codBadge = isCOD 
                ? `<div class="bg-primary-container border border-primary px-3 py-1.5 flex flex-col items-end">
                     <span class="font-label-sm text-label-sm text-on-primary-container">COD AMOUNT</span>
                     <span class="font-data-mono text-data-mono text-primary font-bold">EGP ${(d.cash_to_collect || d.total_amount || 0).toLocaleString('en-US')}</span>
                   </div>`
                : `<div class="bg-surface border border-outline-variant px-3 py-1.5 flex flex-col items-end">
                     <span class="font-label-sm text-label-sm text-on-surface-variant">PREPAID</span>
                     <span class="font-data-mono text-data-mono text-on-surface">EGP 0.00</span>
                   </div>`;

            // Dynamic Action Button based on status
            let buttonsHtml = '';
            if (d.status === 'assigned') {
                buttonsHtml = `
                    <button onclick="updateStatus(${d.id}, 'journey_started')" class="col-span-2 bg-primary text-on-primary font-label-sm text-label-sm py-3 rounded uppercase tracking-wider flex items-center justify-center gap-2 border border-transparent active:opacity-80">
                        <span class="material-symbols-outlined text-[18px]">directions_run</span>
                        Start Journey
                    </button>
                `;
            } else if (d.status === 'journey_started') {
                buttonsHtml = `
                    <button onclick="updateStatus(${d.id}, 'out_for_delivery')" class="col-span-2 bg-[#2563EB] text-white font-label-sm text-label-sm py-3 rounded uppercase tracking-wider flex items-center justify-center gap-2 border border-transparent active:opacity-80">
                        <span class="material-symbols-outlined text-[18px]">local_shipping</span>
                        Out for Delivery
                    </button>
                `;
            } else if (d.status === 'out_for_delivery') {
                buttonsHtml = `
                    <button onclick="updateStatus(${d.id}, 'delivered')" class="bg-[#16A34A] text-white font-label-sm text-label-sm py-3 rounded uppercase tracking-wider flex items-center justify-center gap-2 border border-transparent active:opacity-80">
                        <span class="material-symbols-outlined text-[18px]">check_circle</span>
                        Delivered
                    </button>
                    <button onclick="updateStatus(${d.id}, 'failed')" class="bg-error text-on-error font-label-sm text-label-sm py-3 rounded uppercase tracking-wider flex items-center justify-center gap-2 border border-error active:bg-error-container">
                        <span class="material-symbols-outlined text-[18px]">cancel</span>
                        Failed
                    </button>
                `;
            }

            card.innerHTML = `
                <div class="flex justify-between items-start border-b border-outline-variant pb-3">
                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-label-sm text-label-sm text-on-surface-variant">ORDER ID</span>
                            ${isCOD ? '' : '<span class="material-symbols-outlined text-[14px] text-[#96BF48] font-bold">local_mall</span>'}
                        </div>
                        <span class="font-data-mono text-data-mono text-on-surface text-lg">#RH-${d.order_id}</span>
                    </div>
                    ${codBadge}
                </div>
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-3">
                        <span class="material-symbols-outlined text-on-surface-variant">person</span>
                        <span class="font-headline-md text-headline-md text-on-surface">${d.customer_name || 'Walk-in'}</span>
                    </div>
                    <div class="flex items-start gap-3">
                        <span class="material-symbols-outlined text-on-surface-variant mt-1">location_on</span>
                        <div class="flex flex-col">
                            <span class="font-body-md text-body-md text-on-surface">${d.customer_address}</span>
                        </div>
                    </div>
                    ${d.customer_phone ? `
                    <a class="flex items-center gap-3 mt-2 bg-surface border border-outline-variant p-3 rounded hover:bg-surface-container-high transition-colors" href="tel:${d.customer_phone}">
                        <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">call</span>
                        <span class="font-body-md text-body-md text-primary font-bold">${d.customer_phone}</span>
                    </a>` : ''}
                </div>
                <div class="grid grid-cols-2 gap-2 pt-2">
                    ${buttonsHtml}
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function updateStatus(deliveryId, nextStatus) {
        let notes = '';
        if (nextStatus === 'failed') {
            notes = prompt('Please enter failure reason code:');
            if (notes === null) return; // cancel
        }

        try {
            await Auth.apiRequest(`/api/deliveries/${deliveryId}/status`, {
                method: 'PUT',
                body: JSON.stringify({ status: nextStatus, notes })
            });
            alert(`Delivery updated to ${nextStatus.replace('_', ' ').toUpperCase()}`);
            await loadDriverDeliveries();
        } catch (err) {
            alert('Failed to update status: ' + err.message);
        }
    }

    // Load initial deliveries
    loadDriverDeliveries();
</script>
